<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>synQ — Fleet Management System</title>
  <style>
    :root {
      /* Real Industrial Warehouse SaaS / SCADA Palette */
      --bg-app: #1a1d21;
      --bg-header: #141619;
      --bg-panel: #202428;
      --bg-subpanel: #272c32;
      --bg-map: #16181b;

      --border-color: #2e343b;
      --border-light: #3a424b;

      --text-main: #e1e4e8;
      --text-secondary: #959da5;
      --text-muted: #6a737d;

      /* Restrained Functional Status Colors */
      --color-primary: #1f6feb;       /* Standard corporate blue for selection & navigation */
      --color-primary-hover: #388bfd;
      --color-success: #2ea043;       /* Green: Idle/Healthy/Completed */
      --color-warning: #d29922;       /* Amber: Warning/Low battery */
      --color-danger: #da3633;        /* Red: E-Stop/Obstacle/Fault */

      /* Floorplan Elements */
      --color-rack: #2b313a;
      --color-rack-border: #3d4551;
      --color-aisle: #1d2025;
      --color-lane: rgba(255, 255, 255, 0.04);
      --color-lane-center: rgba(255, 255, 255, 0.12);

      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-system);
      font-size: 13px;
      line-height: 1.4;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ------------------------------------------------------------- */
    /* 1. TOP APPLICATION HEADER                                     */
    /* ------------------------------------------------------------- */
    header.app-header {
      height: 44px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .app-brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .brand-tag {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-divider {
      width: 1px;
      height: 16px;
      background: var(--border-color);
    }

    .site-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .site-name {
      color: var(--text-main);
      font-weight: 500;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
    }

    .status-item strong {
      color: var(--text-main);
      font-weight: 500;
    }

    .dot-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-success);
    }

    .dot-indicator.warning { background: var(--color-warning); }
    .dot-indicator.danger { background: var(--color-danger); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Industrial Emergency Stop Button */
    .btn-estop {
      background: #c92a2a;
      border: 1px solid #e03131;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-estop:hover {
      background: #b02525;
    }

    .btn-estop.active {
      background: #2b8a3e;
      border-color: #2f9e44;
    }

    /* ------------------------------------------------------------- */
    /* 2. MAIN LAYOUT (MAP + RIGHT PANEL)                            */
    /* ------------------------------------------------------------- */
    .main-workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 44px - 26px);
      position: relative;
    }

    /* Left / Center Map (75% workspace) */
    .map-container {
      flex: 1;
      background: var(--bg-map);
      position: relative;
      overflow: hidden;
    }

    canvas#warehouseCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    canvas#warehouseCanvas:active {
      cursor: grabbing;
    }

    /* Clean Map Viewport Controls */
    .map-controls {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(20, 22, 25, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      display: flex;
      align-items: center;
      padding: 2px;
      z-index: 10;
    }

    .map-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .map-btn:hover {
      background: var(--bg-subpanel);
      color: var(--text-main);
    }

    .map-btn.active {
      background: #23282e;
      color: #ffffff;
      font-weight: 500;
    }

    .map-separator {
      width: 1px;
      height: 14px;
      background: var(--border-color);
      margin: 0 2px;
    }

    /* Conflict / Obstacle Operational Notification Pill */
    .map-toast {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #2b1d1d;
      border: 1px solid #672626;
      color: #f85149;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 3px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    /* Map Legend / Scale */
    .map-legend {
      position: absolute;
      bottom: 10px;
      left: 12px;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(20, 22, 25, 0.85);
      padding: 4px 8px;
      border-radius: 2px;
      border: 1px solid var(--border-color);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ------------------------------------------------------------- */
    /* 3. RIGHT OPERATIONS PANEL                                     */
    /* ------------------------------------------------------------- */
    aside.operations-panel {
      width: 360px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
    }

    /* Mode Navigation Tabs */
    .panel-tabs {
      height: 38px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
    }

    .tab-item {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }

    .tab-item:hover {
      color: var(--text-main);
    }

    .tab-item.active {
      color: #ffffff;
      background: var(--bg-panel);
      border-bottom-color: var(--color-primary);
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Standardized Form Layout */
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    label.field-label {
      font-size: 11px;
      color: var(--text-secondary);
    }

    select.input-select {
      background: var(--bg-app);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 3px;
      outline: none;
      width: 100%;
    }

    select.input-select:focus {
      border-color: var(--color-primary);
    }

    .btn-action {
      background: var(--color-primary);
      border: 1px solid #2f81f7;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 3px;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }

    .btn-action:hover {
      background: var(--color-primary-hover);
    }

    .btn-secondary {
      background: var(--bg-subpanel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 3px;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #313740;
    }

    /* Technical Property Grid */
    .prop-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .prop-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 0;
    }

    .prop-name {
      color: var(--text-secondary);
    }

    .prop-val {
      color: var(--text-main);
      font-weight: 500;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    /* Diagnostics Collapsible */
    details.diagnostics-box {
      margin-top: 8px;
      background: var(--bg-app);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      padding: 8px 10px;
      font-size: 11px;
    }

    details.diagnostics-box summary {
      color: var(--text-secondary);
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    /* Fleet Table */
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table.data-table th {
      text-align: left;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
      padding: 6px 4px;
      border-bottom: 1px solid var(--border-color);
    }

    table.data-table td {
      padding: 8px 4px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
    }

    tr.clickable-row {
      cursor: pointer;
    }

    tr.clickable-row:hover {
      background: var(--bg-subpanel);
    }

    tr.clickable-row.selected {
      background: rgba(31, 111, 235, 0.12);
    }

    /* Status Text Pill */
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 2px;
      font-weight: 500;
    }

    .badge-idle { background: rgba(46, 160, 67, 0.15); color: #3fb950; }
    .badge-nav { background: rgba(31, 111, 235, 0.15); color: #58a6ff; }
    .badge-estop { background: rgba(218, 54, 51, 0.15); color: #f85149; }
    .badge-chg { background: rgba(210, 153, 34, 0.15); color: #d29922; }

    /* Operational Event Feed */
    .activity-feed {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .activity-item {
      display: flex;
      gap: 10px;
      font-size: 11px;
      padding: 4px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .activity-time {
      font-family: var(--font-mono);
      color: var(--text-muted);
      width: 36px;
      flex-shrink: 0;
    }

    .activity-robot {
      font-weight: 500;
      color: var(--text-main);
      width: 55px;
      flex-shrink: 0;
    }

    .activity-msg {
      color: var(--text-secondary);
      flex: 1;
    }

    /* ------------------------------------------------------------- */
    /* 4. BOTTOM STATUS STRIP                                        */
    /* ------------------------------------------------------------- */
    footer.status-strip {
      height: 26px;
      background: var(--bg-header);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
      z-index: 100;
    }

    .strip-left, .strip-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .strip-item strong {
      color: var(--text-secondary);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- 1. APPLICATION HEADER -->
  <header class="app-header">
    <div class="header-left">
      <div class="app-brand">
        <span class="brand-name">synQ</span>
        <span class="brand-tag">Fleet Manager</span>
      </div>
      <div class="header-divider"></div>
      <div class="site-selector">
        <span>Site:</span>
        <span class="site-name">Warehouse 01 — Austin Hub</span>
      </div>
    </div>

    <div class="header-center">
      <div class="status-item">
        <span class="dot-indicator" id="dot-fleet"></span>
        <span>Fleet: <strong id="val-fleet-summary">3 online</strong></span>
      </div>
      <div class="status-item">
        <span>Missions: <strong id="val-active-missions">0 active</strong></span>
      </div>
      <div class="status-item">
        <span class="dot-indicator" id="dot-sys"></span>
        <span>System: <strong id="val-sys-status">Normal</strong></span>
      </div>
    </div>

    <div class="header-right">
      <button class="btn-estop" id="btnEstop" onclick="toggleGlobalEstop()">
        <span id="estopLabel">Emergency Stop (All)</span>
      </button>
    </div>
  </header>

  <!-- 2. MAIN WORKSPACE (MAP + RIGHT PANEL) -->
  <main class="main-workspace">

    <!-- Primary Warehouse Floor Plan Map -->
    <section class="map-container" id="mapContainer">
      <canvas id="warehouseCanvas"></canvas>

      <!-- Clean Map Controls -->
      <div class="map-controls">
        <button class="map-btn active" id="btnToggleLanes" onclick="toggleMapLayer('lanes')">Lanes</button>
        <button class="map-btn active" id="btnToggleRacks" onclick="toggleMapLayer('racks')">Racks</button>
        <button class="map-btn active" id="btnToggleRoutes" onclick="toggleMapLayer('routes')">Routes</button>
        <div class="map-separator"></div>
        <button class="map-btn" id="btnSimObstacle" onclick="toggleObstacleTool()">Place Obstacle</button>
        <button class="map-btn" id="btnSimConflict" onclick="triggerCbsConflictDemo()">Resolve Conflict</button>
        <div class="map-separator"></div>
        <button class="map-btn" onclick="resetMapCamera()">Reset View</button>
      </div>

      <!-- Operational Alert Toast -->
      <div class="map-toast" id="mapToast">
        <span id="mapToastText">Notice</span>
      </div>

      <!-- Scale / Coordinates Legend -->
      <div class="map-legend">
        <span>Floor: 15m × 15m</span>
        <span id="legendCoords">X: 0.00m, Y: 0.00m</span>
      </div>
    </section>

    <!-- Contextual Operations Panel -->
    <aside class="operations-panel">
      <div class="panel-tabs">
        <button class="tab-item active" id="tabBtnInspector" onclick="setPanelTab('inspector')">Inspector</button>
        <button class="tab-item" id="tabBtnDispatch" onclick="setPanelTab('dispatch')">Dispatch</button>
        <button class="tab-item" id="tabBtnFleet" onclick="setPanelTab('fleet')">Fleet</button>
        <button class="tab-item" id="tabBtnActivity" onclick="setPanelTab('activity')">Activity</button>
      </div>

      <div class="panel-content" id="panelContent">
        <!-- Rendered dynamically -->
      </div>
    </aside>

  </main>

  <!-- 3. BOTTOM STATUS STRIP -->
  <footer class="status-strip">
    <div class="strip-left">
      <div class="strip-item">ROS 2: <strong>Connected</strong></div>
      <div class="strip-item">Nav2 MPPI: <strong>Online</strong></div>
      <div class="strip-item">CBS Router: <strong>Ready</strong></div>
      <div class="strip-item">VDA 5050: <strong>v2.0.0</strong></div>
    </div>
    <div class="strip-right">
      <div class="strip-item">Digital Twin: <strong>Synchronized</strong></div>
      <div class="strip-item" id="stripTime">00:00:00</div>
    </div>
  </footer>

  <script>
    /* ============================================================= */
    /* INDUSTRIAL FLEET STATE & REAL WAREHOUSE DATA                  */
    /* ============================================================= */

    // Physical Warehouse Definition
    const WAREHOUSE = {
      width: 15.0,
      height: 15.0,
      // Structural Racks (Realistic aisles)
      racks: [
        { id: "A1", x: 2.0, y: 1.8, w: 4.5, h: 1.4, name: "Rack A (01-08)" },
        { id: "B1", x: 8.5, y: 1.8, w: 4.5, h: 1.4, name: "Rack B (01-08)" },
        { id: "C1", x: 2.0, y: 6.8, w: 4.5, h: 1.4, name: "Rack C (01-08)" },
        { id: "D1", x: 8.5, y: 6.8, w: 4.5, h: 1.4, name: "Rack D (01-08)" },
        { id: "E1", x: 2.0, y: 11.8, w: 4.5, h: 1.4, name: "Rack E (01-08)" },
        { id: "F1", x: 8.5, y: 11.8, w: 4.5, h: 1.4, name: "Rack F (01-08)" }
      ],
      // Designated Operational Zones
      zones: [
        { id: "PICK-1", type: "PICK", x: 0.0, y: 4.0, w: 1.8, h: 2.0, label: "Inbound P1" },
        { id: "PICK-2", type: "PICK", x: 0.0, y: 9.0, w: 1.8, h: 2.0, label: "Inbound P2" },
        { id: "DROP-1", type: "DROP", x: 13.2, y: 4.0, w: 1.8, h: 2.0, label: "Outbound D1" },
        { id: "DROP-2", type: "DROP", x: 13.2, y: 9.0, w: 1.8, h: 2.0, label: "Outbound D2" },
        { id: "CHG-1", type: "CHARGE", x: 0.2, y: 0.2, w: 1.6, h: 1.6, label: "Charger 1" },
        { id: "CHG-2", type: "CHARGE", x: 13.2, y: 13.2, w: 1.6, h: 1.6, label: "Charger 2" },
        { id: "PED", type: "RESTRICTED", x: 6.5, y: 0.2, w: 2.0, h: 1.0, label: "Walkway" }
      ]
    };

    // Internal Roadmap Nodes (for CBS routing calculations)
    const ROADMAP_NODES = {};
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const id = `N_${r}_${c}`;
        ROADMAP_NODES[id] = { id, r, c, x: c * 5.0, y: r * 5.0 };
      }
    }

    const ROADMAP_EDGES = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const cur = `N_${r}_${c}`;
        if (c < 3) ROADMAP_EDGES.push({ u: cur, v: `N_${r}_${c+1}` });
        if (r < 3) ROADMAP_EDGES.push({ u: cur, v: `N_${r+1}_${c}` });
      }
    }

    // Physical Fleet State (Single Source of Truth)
    const ROBOTS = {
      "AMR-01": {
        id: "AMR-01",
        status: "Idle", // Idle, Navigating, Charging, Emergency Stop
        battery: 94,
        payload: "Scissor Lift",
        payloadPosition: 0.0,
        mission: "—",
        pickup: "—",
        destination: "—",
        eta: "—",
        speed: 0.0,
        x: 0.0,
        y: 0.0,
        heading: 0,
        targetNode: "N_0_0",
        route: [],
        serial: "SN-SYNQ-2026-001",
        rosState: "synq_amr_node (ACTIVE)",
        ekfState: "Coverged, trace=0.014",
        lidarRange: 12.0
      },
      "AMR-02": {
        id: "AMR-02",
        status: "Idle",
        battery: 88,
        payload: "Conveyor",
        payloadPosition: 0.0,
        mission: "—",
        pickup: "—",
        destination: "—",
        eta: "—",
        speed: 0.0,
        x: 15.0,
        y: 15.0,
        heading: 180,
        targetNode: "N_3_3",
        route: [],
        serial: "SN-SYNQ-2026-002",
        rosState: "synq_amr_node (ACTIVE)",
        ekfState: "Converged, trace=0.019",
        lidarRange: 12.0
      },
      "AMR-03": {
        id: "AMR-03",
        status: "Idle",
        battery: 91,
        payload: "Tote Gripper",
        payloadPosition: 0.0,
        mission: "—",
        pickup: "—",
        destination: "—",
        eta: "—",
        speed: 0.0,
        x: 15.0,
        y: 0.0,
        heading: 90,
        targetNode: "N_0_3",
        route: [],
        serial: "SN-SYNQ-2026-003",
        rosState: "synq_amr_node (ACTIVE)",
        ekfState: "Converged, trace=0.012",
        lidarRange: 12.0
      }
    };

    // UI View State
    let selectedRobotId = "AMR-01";
    let activeTab = "inspector";
    let isEstopActive = false;
    let obstacleToolActive = false;
    let placedObstacles = [];

    const mapLayers = {
      lanes: true,
      racks: true,
      routes: true
    };

    let camera = {
      x: 0,
      y: 0,
      zoom: 1.0,
      dragging: false,
      startX: 0,
      startY: 0
    };

    // Operational Event Log
    const ACTIVITIES = [
      { time: "23:45", robot: "AMR-01", msg: "System ready. Standby at N_0_0" },
      { time: "23:45", robot: "AMR-02", msg: "System ready. Standby at N_3_3" },
      { time: "23:45", robot: "AMR-03", msg: "System ready. Standby at N_0_3" }
    ];

    function logActivity(robot, msg) {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      ACTIVITIES.unshift({ time: timeStr, robot, msg });
      if (ACTIVITIES.length > 40) ACTIVITIES.pop();
      if (activeTab === "activity") renderPanel();
    }

    /* ============================================================= */
    /* 2. REALISTIC TOP-DOWN MAP RENDERER                            */
    /* ============================================================= */

    const canvas = document.getElementById("warehouseCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const container = document.getElementById("mapContainer");
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function resetMapCamera() {
      camera.x = 0;
      camera.y = 0;
      camera.zoom = 1.0;
    }

    function getMapTransform() {
      const pad = 60;
      const availW = canvas.width - pad * 2;
      const availH = canvas.height - pad * 2;
      const baseScale = Math.min(availW / WAREHOUSE.width, availH / WAREHOUSE.height);
      const scale = baseScale * camera.zoom;
      const originX = (canvas.width - WAREHOUSE.width * scale) / 2 + camera.x;
      const originY = (canvas.height - WAREHOUSE.height * scale) / 2 + camera.y;
      return { originX, originY, scale };
    }

    function toScreen(wx, wy) {
      const { originX, originY, scale } = getMapTransform();
      return { x: originX + wx * scale, y: originY + wy * scale };
    }

    function toWorld(sx, sy) {
      const { originX, originY, scale } = getMapTransform();
      return { x: (sx - originX) / scale, y: (sy - originY) / scale };
    }

    function renderMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const { originX, originY, scale } = getMapTransform();

      // Warehouse Perimeter Floor
      ctx.fillStyle = "#16191d";
      ctx.fillRect(originX, originY, WAREHOUSE.width * scale, WAREHOUSE.height * scale);
      ctx.strokeStyle = "#2e343b";
      ctx.lineWidth = 1;
      ctx.strokeRect(originX, originY, WAREHOUSE.width * scale, WAREHOUSE.height * scale);

      // Subtle Meter Grid
      ctx.strokeStyle = "rgba(255, 255, 255, 0.025)";
      ctx.lineWidth = 1;
      for (let m = 1; m < WAREHOUSE.width; m++) {
        const p1 = toScreen(m, 0);
        const p2 = toScreen(m, WAREHOUSE.height);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      for (let m = 1; m < WAREHOUSE.height; m++) {
        const p1 = toScreen(0, m);
        const p2 = toScreen(WAREHOUSE.width, m);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      // Operational Zones
      WAREHOUSE.zones.forEach(zone => {
        const p = toScreen(zone.x, zone.y);
        const w = zone.w * scale;
        const h = zone.h * scale;

        if (zone.type === "PICK") {
          ctx.fillStyle = "rgba(46, 160, 67, 0.08)";
          ctx.strokeStyle = "rgba(46, 160, 67, 0.4)";
        } else if (zone.type === "DROP") {
          ctx.fillStyle = "rgba(31, 111, 235, 0.08)";
          ctx.strokeStyle = "rgba(31, 111, 235, 0.4)";
        } else if (zone.type === "CHARGE") {
          ctx.fillStyle = "rgba(210, 153, 34, 0.08)";
          ctx.strokeStyle = "rgba(210, 153, 34, 0.4)";
        } else {
          ctx.fillStyle = "rgba(218, 54, 51, 0.08)";
          ctx.strokeStyle = "rgba(218, 54, 51, 0.3)";
        }

        ctx.lineWidth = 1;
        ctx.fillRect(p.x, p.y, w, h);
        ctx.strokeRect(p.x, p.y, w, h);

        ctx.fillStyle = "#8b949e";
        ctx.font = "10px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(zone.label, p.x + 6, p.y + 14);
      });

      // Navigation Lanes (Subtle transit corridors)
      if (mapLayers.lanes) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.lineWidth = 12 * (scale / 40);
        ctx.lineCap = "round";
        ROADMAP_EDGES.forEach(e => {
          const n1 = ROADMAP_NODES[e.u];
          const n2 = ROADMAP_NODES[e.v];
          const p1 = toScreen(n1.x, n1.y);
          const p2 = toScreen(n2.x, n2.y);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        });

        // Center line
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 5]);
        ROADMAP_EDGES.forEach(e => {
          const n1 = ROADMAP_NODES[e.u];
          const n2 = ROADMAP_NODES[e.v];
          const p1 = toScreen(n1.x, n1.y);
          const p2 = toScreen(n2.x, n2.y);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        });
        ctx.setLineDash([]);
      }

      // Storage Racks
      if (mapLayers.racks) {
        WAREHOUSE.racks.forEach(rack => {
          const p = toScreen(rack.x, rack.y);
          const w = rack.w * scale;
          const h = rack.h * scale;

          ctx.fillStyle = "#22272e";
          ctx.strokeStyle = "#373e47";
          ctx.lineWidth = 1;
          ctx.fillRect(p.x, p.y, w, h);
          ctx.strokeRect(p.x, p.y, w, h);

          // Pallet bays
          const bays = 8;
          const bayW = w / bays;
          ctx.strokeStyle = "#2d333b";
          for (let i = 1; i < bays; i++) {
            ctx.beginPath();
            ctx.moveTo(p.x + i * bayW, p.y);
            ctx.lineTo(p.x + i * bayW, p.y + h);
            ctx.stroke();
          }

          ctx.fillStyle = "#768390";
          ctx.font = "10px -apple-system, BlinkMacSystemFont, sans-serif";
          ctx.fillText(rack.name, p.x + 6, p.y - 4);
        });
      }

      // Placed Obstacles
      placedObstacles.forEach(obs => {
        const p = toScreen(obs.x, obs.y);
        const r = (obs.radius || 0.7) * scale;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(218, 54, 51, 0.25)";
        ctx.strokeStyle = "#da3633";
        ctx.lineWidth = 1.5;
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#f85149";
        ctx.font = "10px var(--font-system)";
        ctx.fillText("Obstacle", p.x - 20, p.y + 3);
      });

      // Robot Routes
      if (mapLayers.routes) {
        Object.values(ROBOTS).forEach(bot => {
          if (!bot.route || bot.route.length === 0) return;
          const isSelected = (bot.id === selectedRobotId);

          ctx.strokeStyle = isSelected ? "#388bfd" : "rgba(88, 166, 255, 0.3)";
          ctx.lineWidth = isSelected ? 2 : 1;
          ctx.beginPath();
          const start = toScreen(bot.x, bot.y);
          ctx.moveTo(start.x, start.y);
          bot.route.forEach(nid => {
            const n = ROADMAP_NODES[nid];
            if (n) {
              const pt = toScreen(n.x, n.y);
              ctx.lineTo(pt.x, pt.y);
            }
          });
          ctx.stroke();
        });
      }

      // Top-Down AMRs (Physical scale 0.7m x 0.5m)
      Object.values(ROBOTS).forEach(bot => {
        const p = toScreen(bot.x, bot.y);
        const isSelected = (bot.id === selectedRobotId);
        const lengthPx = 0.70 * scale;
        const widthPx = 0.50 * scale;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(bot.heading * Math.PI / 180);

        // Safety Radius (Visible when selected)
        if (isSelected) {
          ctx.beginPath();
          ctx.arc(0, 0, (lengthPx / 2) * 1.4, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(31, 111, 235, 0.35)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // Robot Chassis
        ctx.fillStyle = isSelected ? "#27303f" : "#22272e";
        ctx.strokeStyle = isSelected ? "#388bfd" : "#444c56";
        ctx.lineWidth = 1.5;
        ctx.fillRect(-lengthPx / 2, -widthPx / 2, lengthPx, widthPx);
        ctx.strokeRect(-lengthPx / 2, -widthPx / 2, lengthPx, widthPx);

        // Wheels
        ctx.fillStyle = "#1b1f24";
        const wL = lengthPx * 0.25;
        const wW = 3;
        ctx.fillRect(-lengthPx / 2, -widthPx / 2 - wW, wL, wW);
        ctx.fillRect(lengthPx / 2 - wL, -widthPx / 2 - wW, wL, wW);
        ctx.fillRect(-lengthPx / 2, widthPx / 2, wL, wW);
        ctx.fillRect(lengthPx / 2 - wL, widthPx / 2, wL, wW);

        // Heading Indicator (Direction tick)
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(lengthPx / 2 + 4, 0);
        ctx.stroke();

        ctx.restore();

        // Label
        ctx.fillStyle = isSelected ? "#ffffff" : "#adb5bd";
        ctx.font = "11px var(--font-system)";
        ctx.fillText(bot.id, p.x - 18, p.y - widthPx / 2 - 6);

        ctx.fillStyle = bot.battery < 20 ? "#f85149" : (bot.battery < 40 ? "#d29922" : "#3fb950");
        ctx.font = "10px var(--font-mono)";
        ctx.fillText(`${bot.battery}%`, p.x + 16, p.y - widthPx / 2 - 6);
      });

      requestAnimationFrame(renderMap);
    }
    requestAnimationFrame(renderMap);

    /* ============================================================= */
    /* 3. MOUSE INTERACTION & PAN/ZOOM                               */
    /* ============================================================= */

    canvas.addEventListener("mousedown", e => {
      camera.dragging = true;
      camera.startX = e.clientX;
      camera.startY = e.clientY;

      const rect = canvas.getBoundingClientRect();
      const wPos = toWorld(e.clientX - rect.left, e.clientY - rect.top);

      // Handle Obstacle Placement
      if (obstacleToolActive) {
        placedObstacles.push({ x: wPos.x, y: wPos.y, radius: 0.75 });
        obstacleToolActive = false;
        document.getElementById("btnSimObstacle").classList.remove("active");
        showToast("Obstacle placed. Replanning intersecting routes...");
        logActivity("System", `Obstacle placed at (${wPos.x.toFixed(1)}m, ${wPos.y.toFixed(1)}m)`);

        // Check if any robot is blocked
        Object.values(ROBOTS).forEach(bot => {
          if (bot.status === "Navigating" && bot.route.length > 0) {
            setTimeout(() => {
              bot.route = ["N_2_1", "N_2_2", "N_1_2"];
              logActivity(bot.id, "Route replanned around obstacle");
              showToast(`${bot.id}: Diverting around obstacle`);
            }, 600);
          }
        });
        return;
      }

      // Check if user clicked a robot
      let clicked = null;
      for (const bot of Object.values(ROBOTS)) {
        if (Math.hypot(bot.x - wPos.x, bot.y - wPos.y) <= 0.6) {
          clicked = bot.id;
          break;
        }
      }

      if (clicked) {
        selectedRobotId = clicked;
        setPanelTab("inspector");
      }
    });

    window.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      const wPos = toWorld(e.clientX - rect.left, e.clientY - rect.top);
      document.getElementById("legendCoords").textContent =
        `X: ${Math.max(0, Math.min(15, wPos.x)).toFixed(2)}m, Y: ${Math.max(0, Math.min(15, wPos.y)).toFixed(2)}m`;

      if (camera.dragging && !obstacleToolActive) {
        camera.x += e.clientX - camera.startX;
        camera.y += e.clientY - camera.startY;
        camera.startX = e.clientX;
        camera.startY = e.clientY;
      }
    });

    window.addEventListener("mouseup", () => {
      camera.dragging = false;
    });

    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 0.92;
      camera.zoom = Math.max(0.6, Math.min(2.5, camera.zoom * factor));
    });

    function toggleMapLayer(layer) {
      mapLayers[layer] = !mapLayers[layer];
      const btnMap = {
        lanes: "btnToggleLanes",
        racks: "btnToggleRacks",
        routes: "btnToggleRoutes"
      };
      document.getElementById(btnMap[layer]).classList.toggle("active", mapLayers[layer]);
    }

    function toggleObstacleTool() {
      obstacleToolActive = !obstacleToolActive;
      document.getElementById("btnSimObstacle").classList.toggle("active", obstacleToolActive);
      if (obstacleToolActive) {
        showToast("Click on any lane to place an obstacle");
      } else {
        hideToast();
      }
    }

    function triggerCbsConflictDemo() {
      showToast("Simulating two AMRs on intersecting crossing paths...");
      logActivity("CBS", "Simulating head-on trajectory conflict");

      ROBOTS["AMR-01"].status = "Navigating";
      ROBOTS["AMR-01"].x = 0.0;
      ROBOTS["AMR-01"].y = 0.0;
      ROBOTS["AMR-01"].route = ["N_0_1", "N_0_2"];

      ROBOTS["AMR-03"].status = "Navigating";
      ROBOTS["AMR-03"].x = 15.0;
      ROBOTS["AMR-03"].y = 0.0;
      ROBOTS["AMR-03"].route = ["N_0_2", "N_0_1", "N_0_0"];

      setTimeout(() => {
        showToast("CBS conflict detected at N_0_1. AMR-03 assigned bypass corridor.");
        ROBOTS["AMR-03"].route = ["N_0_2", "N_1_2", "N_1_1", "N_0_1"];
        logActivity("CBS", "AMR-03 routed via bypass corridor. Zero collisions.");
      }, 1000);
    }

    function showToast(msg) {
      const toast = document.getElementById("mapToast");
      document.getElementById("mapToastText").textContent = msg;
      toast.style.display = "flex";
      setTimeout(hideToast, 4000);
    }

    function hideToast() {
      document.getElementById("mapToast").style.display = "none";
    }

    /* ============================================================= */
    /* 4. CONTEXTUAL OPERATIONS PANEL                                */
    /* ============================================================= */

    function setPanelTab(tab) {
      activeTab = tab;
      ["inspector", "dispatch", "fleet", "activity"].forEach(t => {
        const btn = document.getElementById(`tabBtn${t.charAt(0).toUpperCase() + t.slice(1)}`);
        if (btn) btn.classList.toggle("active", t === tab);
      });
      renderPanel();
    }

    function renderPanel() {
      const container = document.getElementById("panelContent");
      container.innerHTML = "";

      if (activeTab === "inspector") {
        renderInspector(container);
      } else if (activeTab === "dispatch") {
        renderDispatch(container);
      } else if (activeTab === "fleet") {
        renderFleet(container);
      } else if (activeTab === "activity") {
        renderActivity(container);
      }
    }

    // Inspector View (Relevant Operational Data + Diagnostics Collapsible)
    function renderInspector(container) {
      const bot = ROBOTS[selectedRobotId] || ROBOTS["AMR-01"];

      let badgeClass = "badge-idle";
      if (bot.status === "Navigating") badgeClass = "badge-nav";
      if (bot.status === "Charging") badgeClass = "badge-chg";
      if (bot.status === "Emergency Stop") badgeClass = "badge-estop";

      container.innerHTML = `
        <div>
          <div class="section-title">
            <span>${bot.id}</span>
            <span class="badge ${badgeClass}">${bot.status}</span>
          </div>

          <div class="prop-list">
            <div class="prop-row"><span class="prop-name">Battery</span><span class="prop-val">${bot.battery}%</span></div>
            <div class="prop-row"><span class="prop-name">Payload</span><span class="prop-val">${bot.payload}</span></div>
            <div class="prop-row"><span class="prop-name">Current Mission</span><span class="prop-val">${bot.mission}</span></div>
            <div class="prop-row"><span class="prop-name">Pickup</span><span class="prop-val">${bot.pickup}</span></div>
            <div class="prop-row"><span class="prop-name">Destination</span><span class="prop-val">${bot.destination}</span></div>
            <div class="prop-row"><span class="prop-name">ETA</span><span class="prop-val">${bot.eta}</span></div>
            <div class="prop-row"><span class="prop-name">Speed</span><span class="prop-val">${bot.speed.toFixed(2)} m/s</span></div>
            <div class="prop-row"><span class="prop-name">Position</span><span class="prop-val">X: ${bot.x.toFixed(2)}m, Y: ${bot.y.toFixed(2)}m</span></div>
            <div class="prop-row"><span class="prop-name">Heading</span><span class="prop-val">${bot.heading.toFixed(0)}°</span></div>
          </div>

          <details class="diagnostics-box">
            <summary>System Diagnostics</summary>
            <div class="prop-list" style="margin-top: 8px;">
              <div class="prop-row"><span class="prop-name">Serial</span><span class="prop-val">${bot.serial}</span></div>
              <div class="prop-row"><span class="prop-name">ROS Node</span><span class="prop-val">${bot.rosState}</span></div>
              <div class="prop-row"><span class="prop-name">EKF Localization</span><span class="prop-val">${bot.ekfState}</span></div>
              <div class="prop-row"><span class="prop-name">LiDAR</span><span class="prop-val">Range ${bot.lidarRange}m, Clear</span></div>
            </div>
          </details>

          <div style="display: flex; gap: 8px; margin-top: 16px;">
            <button class="btn-secondary" style="flex: 1;" onclick="dockRobot('${bot.id}')">Send to Charger</button>
            <button class="btn-secondary" style="flex: 1;" onclick="toggleHoldRobot('${bot.id}')">${bot.status === 'Navigating' ? 'Pause' : 'Resume'}</button>
          </div>
        </div>
      `;
    }

    // Dispatch Workflow (Operational Step-by-Step)
    function renderDispatch(container) {
      container.innerHTML = `
        <div>
          <div class="section-title">Mission Dispatch</div>

          <div class="field-group">
            <label class="field-label">1. Pickup Location</label>
            <select class="input-select" id="pickSelect" onchange="updateDispatchPreview()">
              <option value="N_1_0">Infeed Aisle (N_1_0)</option>
              <option value="N_1_1" selected>Rack Bay B (N_1_1)</option>
              <option value="N_1_2">Rack Bay C (N_1_2)</option>
              <option value="N_1_3">Feeder Station (N_1_3)</option>
            </select>
          </div>

          <div class="field-group">
            <label class="field-label">2. Payload Required</label>
            <select class="input-select" id="payloadSelect" onchange="updateDispatchPreview()">
              <option value="Scissor Lift">Scissor Lift (Pallets)</option>
              <option value="Conveyor">Conveyor (Carton transfer)</option>
              <option value="Tote Gripper">Tote Gripper (Bins)</option>
            </select>
          </div>

          <div class="field-group">
            <label class="field-label">3. Destination</label>
            <select class="input-select" id="dropSelect" onchange="updateDispatchPreview()">
              <option value="N_2_0">Outbound Dock D1 (N_2_0)</option>
              <option value="N_2_1">Outbound Dock D2 (N_2_1)</option>
              <option value="N_2_2" selected>Packing Station (N_2_2)</option>
              <option value="N_2_3">Staging Area (N_2_3)</option>
            </select>
          </div>

          <div class="section-title" style="margin-top: 14px;">Route & Assignment Preview</div>
          <div class="prop-list" id="dispatchPreview" style="margin-bottom: 14px;">
            <!-- Dynamically populated -->
          </div>

          <button class="btn-action" onclick="confirmDispatch()">Dispatch Mission</button>
        </div>
      `;
      updateDispatchPreview();
    }

    function updateDispatchPreview() {
      const payload = document.getElementById("payloadSelect")?.value || "Scissor Lift";
      const preview = document.getElementById("dispatchPreview");
      if (!preview) return;

      let candidate = Object.values(ROBOTS).find(b => b.status !== "Emergency Stop" && b.payload === payload);
      if (!candidate) candidate = ROBOTS["AMR-01"];

      preview.innerHTML = `
        <div class="prop-row"><span class="prop-name">Selected Robot</span><span class="prop-val">${candidate.id} (${candidate.payload})</span></div>
        <div class="prop-row"><span class="prop-name">Distance</span><span class="prop-val">12.5 m</span></div>
        <div class="prop-row"><span class="prop-name">Estimated Time</span><span class="prop-val">14 sec</span></div>
        <div class="prop-row"><span class="prop-name">Battery After Mission</span><span class="prop-val">${candidate.battery - 1}%</span></div>
        <div class="prop-row"><span class="prop-name">Route Conflicts</span><span class="prop-val" style="color: var(--color-success);">0 Detected</span></div>
      `;
    }

    function confirmDispatch() {
      const pick = document.getElementById("pickSelect").value;
      const drop = document.getElementById("dropSelect").value;
      const payload = document.getElementById("payloadSelect").value;

      let candidate = Object.values(ROBOTS).find(b => b.status !== "Emergency Stop" && b.payload === payload);
      if (!candidate) candidate = ROBOTS["AMR-01"];

      candidate.status = "Navigating";
      candidate.mission = `TASK-${Math.floor(1000 + Math.random() * 9000)}`;
      candidate.pickup = pick;
      candidate.destination = drop;
      candidate.eta = "14s";
      candidate.route = [pick, drop];

      logActivity(candidate.id, `Mission ${candidate.mission} dispatched to ${drop}`);
      showToast(`Mission dispatched: ${candidate.id}`);
      setPanelTab("inspector");
    }

    function toggleGlobalEstop() {
      isEstopActive = !isEstopActive;
      const btn = document.getElementById("btnEstop");
      const label = document.getElementById("estopLabel");

      if (isEstopActive) {
        btn.classList.add("active");
        label.textContent = "Reset Emergency Stop";
        Object.values(ROBOTS).forEach(b => {
          b.status = "Emergency Stop";
          b.speed = 0.0;
          b.route = [];
        });
        document.getElementById("dot-sys").className = "dot-indicator danger";
        document.getElementById("val-sys-status").textContent = "Emergency Stop";
        logActivity("Safety", "Global Emergency Stop engaged");
        showToast("Global Emergency Stop engaged — All AMRs halted");
      } else {
        btn.classList.remove("active");
        label.textContent = "Emergency Stop (All)";
        Object.values(ROBOTS).forEach(b => {
          b.status = "Idle";
        });
        document.getElementById("dot-sys").className = "dot-indicator";
        document.getElementById("val-sys-status").textContent = "Normal";
        logActivity("Safety", "Emergency Stop reset by operator");
        hideToast();
      }
      renderPanel();

      fetch("/api/v1/robots/ALL/estop", { method: "POST" }).catch(() => {});
    }

    function toggleHoldRobot(id) {
      const bot = ROBOTS[id];
      if (!bot) return;
      if (bot.status === "Navigating") {
        bot.status = "Idle";
        logActivity(id, "Motion paused");
      } else {
        bot.status = "Navigating";
        logActivity(id, "Motion resumed");
      }
      renderPanel();
    }

    function dockRobot(id) {
      const bot = ROBOTS[id];
      if (!bot) return;
      bot.status = "Navigating";
      bot.destination = "Charger 1";
      bot.route = ["N_0_0"];
      logActivity(id, "Returning to charging dock");
      renderPanel();
    }

    /* ============================================================= */
    /* 6. DISCRETE SIMULATION & CLOCK LOOP                           */
    /* ============================================================= */

    setInterval(() => {
      // Clock
      const now = new Date();
      document.getElementById("stripTime").textContent = now.toTimeString().split(" ")[0];

      // Step robot transit along planned routes
      let activeCount = 0;
      Object.values(ROBOTS).forEach(bot => {
        if (bot.status === "Navigating" && bot.route.length > 0) {
          activeCount++;
          const targetId = bot.route[0];
          const node = ROADMAP_NODES[targetId];
          if (node) {
            const dx = node.x - bot.x;
            const dy = node.y - bot.y;
            const dist = Math.hypot(dx, dy);

            if (dist < 0.15) {
              bot.x = node.x;
              bot.y = node.y;
              bot.targetNode = targetId;
              bot.route.shift();
              if (bot.route.length === 0) {
                bot.status = "Idle";
                bot.mission = "—";
                bot.pickup = "—";
                bot.destination = "—";
                bot.eta = "—";
                bot.speed = 0.0;
                logActivity(bot.id, `Arrived at destination (${targetId})`);
                renderPanel();
              }
            } else {
              bot.speed = 0.8;
              bot.x += (dx / dist) * 0.06;
              bot.y += (dy / dist) * 0.06;
              bot.heading = Math.atan2(dy, dx) * 180 / Math.PI;
            }
          }
        }
      });

      document.getElementById("val-active-missions").textContent = `${activeCount} active`;

      // Sync with backend API if running
      fetch("/api/v1/fleet")
        .then(res => res.json())
        .then(() => {
          document.getElementById("dot-fleet").className = "dot-indicator";
        })
        .catch(() => {});
    }, 50);

    renderPanel();
  </script>
</body>
