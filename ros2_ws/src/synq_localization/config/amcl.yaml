amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2  # Expected noise in odometry rotation estimate from rotation
    alpha2: 0.2  # Expected noise in odometry rotation estimate from translation
    alpha3: 0.2  # Expected noise in odometry translation estimate from translation
    alpha4: 0.2  # Expected noise in odometry translation estimate from rotation
    alpha5: 0.2  # Translation noise parameter for omni models (strafe noise)
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "/sensors/lidar/scan"
    laser_model_type: "likelihood_field"
    robot_model_type: "nav2_amcl::OmniMotionModel"  # Explicit omnidirectional Mecanum model
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.10
    update_min_a: 0.15
    resample_interval: 1
    transform_tolerance: 0.5
    z_hit: 0.85
    z_rand: 0.15
    sigma_hit: 0.15
    laser_likelihood_max_dist: 2.0
